version: '3.9'
services:
  db:
    image: postgres:16-alpine
    container_name: finatial-control-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finatial
      POSTGRES_PASSWORD: finatial
      POSTGRES_DB: finatial_control
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  api:
    build: ./server
    container_name: finatial-control-api
    env_file:
      - server/.env.example
    depends_on:
      - db
    ports:
      - "4000:4000"
    command: ["npm", "start"]
volumes:
  pgdata:
