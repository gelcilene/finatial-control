<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finatial Control - Web</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Finatial Control</h1>
      <p>Controle online de contas com lembretes multi-canal e comprovantes.</p>
    </header>

    <section class="card" id="config-section">
      <h2>Configuração de Lembretes</h2>
      <div class="grid">
        <label>Dia do mês para alertas
          <input type="number" id="reminderDay" min="1" max="28" value="5" />
        </label>
        <label>WhatsApp (E.164)
          <input type="tel" id="whatsapp" placeholder="+5511999990000" />
        </label>
        <label>Telegram @username
          <input type="text" id="telegram" placeholder="@usuario" />
        </label>
        <label>Email
          <input type="email" id="email" placeholder="contato@exemplo.com" />
        </label>
      </div>
      <button id="saveConfig">Salvar Configuração</button>
    </section>

    <section class="card" id="form-section">
      <h2>Registrar Conta</h2>
      <form id="billForm">
        <div class="grid">
          <label>Nome da conta
            <input name="name" required />
          </label>
          <label>Valor (R$)
            <input name="amount" type="number" step="0.01" required />
          </label>
          <label>Vencimento
            <input name="dueDate" type="date" required />
          </label>
          <label>Senha do registro
            <input name="password" type="password" required />
          </label>
        </div>
        <button type="submit">Adicionar</button>
      </form>
    </section>

    <section class="card" id="bills-section">
      <h2>Contas Cadastradas</h2>
      <div id="bills"></div>
    </section>

    <section class="card" id="log-section">
      <h2>Histórico</h2>
      <ul id="auditLog"></ul>
    </section>

    <template id="bill-template">
      <article class="bill">
        <div>
          <h3 class="bill-title"></h3>
          <p class="bill-details"></p>
          <p class="bill-status"></p>
        </div>
        <div class="actions">
          <label class="proof-upload">Comprovante
            <input type="file" class="proof-input" accept="image/*,application/pdf" />
          </label>
          <input type="password" class="password-check" placeholder="Senha" />
          <button class="mark-paid">Marcar como pago</button>
          <button class="simulate-reminder">Simular lembrete</button>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
